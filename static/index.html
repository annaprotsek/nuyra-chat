<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUYRA</title>
  <style>
    /* біло-фіолетово-бузкова палітра */
    :root {
      --bg: #faf7ff;
      --panel: #ffffff;
      --text: #2e1a47;
      --muted: #8a7aa8;
      --border: #dcd0f5;
      --user-bg: #7c4dff;
      --user-text: #ffffff;
      --bot-bg: #ede7fb;
      --bot-text: #2e1a47;
      --accent-from: #7c4dff;
      --accent-to: #b388ff;
      --hover: #f3eefd;
      --active: #e3d9fb;
      --code-bg: rgba(124, 77, 255, 0.1);
      --error: #d6336c;
    }
    /* темна тема: темно-фіолетовий фон, бузкові акценти */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16111f;
        --panel: #1f1830;
        --text: #efe8ff;
        --muted: #a497c2;
        --border: #3a2e55;
        --user-bg: #8f6bff;
        --bot-bg: #2c2342;
        --bot-text: #efe8ff;
        --accent-from: #b388ff;
        --accent-to: #e0c3ff;
        --hover: #2a2140;
        --active: #3a2e55;
        --code-bg: rgba(179, 136, 255, 0.15);
        --error: #ff7aa2;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button { font: inherit; border: 0; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .primary { border-radius: 12px; background: var(--user-bg); color: var(--user-text); }
    .icon { background: none; color: var(--muted); border-radius: 8px; padding: 6px 8px; }
    .icon:hover { color: var(--text); }

    /* ---- бічна панель ---- */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }
    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.12em;
      background: linear-gradient(90deg, var(--accent-from), var(--accent-to));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #new-chat { padding: 10px; }
    #chat-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 8px; }
    .chat-item { display: flex; align-items: center; border-radius: 10px; }
    .chat-item:hover { background: var(--hover); }
    .chat-item.active { background: var(--active); }
    .chat-title {
      flex: 1;
      padding: 9px 10px;
      overflow: hidden;
      text-overflow: ellipsis;  /* довга назва обрізається трьома крапками */
      white-space: nowrap;
      cursor: pointer;
    }
    .delete-chat {
      opacity: 0;          /* хрестик видно лише при наведенні */
      font-size: 20px;
      line-height: 1;
      padding: 4px 10px;
    }
    .delete-chat:hover { color: var(--error); }  /* при наведенні — малиновий */
    .chat-item:hover .delete-chat,
    .chat-item.active .delete-chat { opacity: 1; }

    /* ---- область чату ---- */
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 53px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    #menu-btn { display: none; font-size: 20px; }
    #chat-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }
    .msg-row { display: flex; flex-direction: column; gap: 2px; max-width: 80%; }
    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.assistant { align-self: flex-start; align-items: flex-start; }
    .msg {
      padding: 10px 14px;
      border-radius: 16px;
      overflow-wrap: anywhere;    /* довгі слова не ламають розмітку */
    }
    .msg.user {
      white-space: pre-wrap;      /* зберігаємо переноси рядків */
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant { background: var(--bot-bg); color: var(--bot-text); border-bottom-left-radius: 4px; }

    /* Markdown у відповідях */
    .msg.assistant > :first-child { margin-top: 0; }
    .msg.assistant > :last-child { margin-bottom: 0; }
    .msg.assistant p, .msg.assistant ul, .msg.assistant ol { margin: 0.5em 0; }
    .msg.assistant ul, .msg.assistant ol { padding-left: 1.4em; }
    .msg.assistant code { font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
    .msg.assistant pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
    .msg.assistant pre code { background: none; padding: 0; }
    .msg.assistant table { display: block; overflow-x: auto; border-collapse: collapse; }
    .msg.assistant th, .msg.assistant td { border: 1px solid var(--border); padding: 4px 8px; }
    .msg.assistant a { color: var(--user-bg); }

    /* кнопки під повідомленням */
    .actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
    .msg-row:hover .actions { opacity: 1; }
    .action { font-size: 15px; line-height: 1; padding: 2px 6px; }
    .action-delete:hover { color: var(--error); }
    #status { min-height: 1.5em; padding: 0 16px; max-width: 760px; width: 100%; margin: 0 auto; color: var(--muted); font-size: 14px; }
    #status.error { color: var(--error); }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    textarea::placeholder { color: var(--muted); }
    textarea:focus { outline: 2px solid var(--user-bg); outline-offset: -1px; }
    #send { padding: 0 18px; }

    /* ---- вузький екран: панель ховається під ☰ ---- */
    #backdrop { display: none; }
    @media (max-width: 700px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        transform: translateX(-100%);  /* панель за лівим краєм екрана */
        transition: transform 0.2s;
      }
      body.sidebar-open #sidebar { transform: none; }
      body.sidebar-open #backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 5;
        background: rgba(20, 10, 40, 0.4);  /* затемнення під панеллю */
      }
      #menu-btn { display: block; }
      .delete-chat { opacity: 1; }  /* на телефоні немає наведення — хрестик видно завжди */
      .actions { opacity: 1; }      /* і кнопки під повідомленнями теж */
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-top">
      <span class="logo">NUYRA</span>
      <button id="new-chat" class="primary" type="button">+ Новий чат</button>
    </div>
    <ul id="chat-list"></ul>
  </aside>
  <div id="backdrop"></div>

  <div id="main">
    <header>
      <button id="menu-btn" class="icon" type="button" aria-label="Чати">☰</button>
      <span id="chat-title"></span>
    </header>
    <main id="messages"></main>
    <div id="status"></div>
    <form id="form">
      <textarea id="input" rows="2" placeholder="Напиши повідомлення… (Enter — надіслати, Shift+Enter — новий рядок)"></textarea>
      <button id="send" class="primary" type="submit">➤</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    const chatListEl = document.getElementById("chat-list");
    const chatTitleEl = document.getElementById("chat-title");
    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    let chats = [];             // список чатів для панелі: [{id, title}]
    let currentChatId = null;   // який чат відкрито зараз
    let messages = [];          // повідомлення відкритого чату: [{id, role, content}]
    let busy = false;           // чекаємо відповідь — нові запити не надсилаємо

    // один запит до нашого API; кидає помилку з текстом від сервера
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 204) return null; // 204 — успіх без тіла відповіді
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Щось пішло не так");
      return data;
    }

    // посилання з відповідей відкриваємо в новій вкладці, щоб не закрити чат
    DOMPurify.addHook("afterSanitizeAttributes", (node) => {
      if (node.tagName === "A") {
        node.target = "_blank";
        node.rel = "noopener";
      }
    });

    // marked: Markdown → HTML; DOMPurify: вирізаємо з HTML усе небезпечне
    function renderMarkdown(text) {
      return DOMPurify.sanitize(marked.parse(text));
    }

    // перемалювати всі повідомлення відкритого чату
    function renderMessages() {
      messagesEl.innerHTML = "";
      messages.forEach((m, i) => {
        const row = document.createElement("div");
        row.className = "msg-row " + m.role;

        const bubble = document.createElement("div");
        bubble.className = "msg " + m.role;
        if (m.role === "assistant") bubble.innerHTML = renderMarkdown(m.content);
        else bubble.textContent = m.content; // твій текст — без Markdown, як є
        row.appendChild(bubble);

        // у щойно надісланого повідомлення ще немає id — кнопки з'являться після збереження
        if (m.id !== null) row.appendChild(renderActions(m, i === messages.length - 1));
        messagesEl.appendChild(row);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight; // прокрутити донизу
    }

    function actionButton(label, hint, onClick) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "icon action";
      btn.textContent = label;
      btn.title = hint; // підказка при наведенні
      btn.setAttribute("aria-label", hint);
      btn.addEventListener("click", onClick);
      return btn;
    }

    function renderActions(message, isLast) {
      const actions = document.createElement("div");
      actions.className = "actions";
      if (message.role === "assistant") {
        actions.appendChild(actionButton("⧉", "Копіювати", (e) => copyMessage(message, e.currentTarget)));
        if (isLast) actions.appendChild(actionButton("↻", "Перегенерувати", regenerate));
      }
      const del = actionButton("×", "Видалити", () => deleteMessage(message));
      del.classList.add("action-delete");
      actions.appendChild(del);
      return actions;
    }

    async function copyMessage(message, btn) {
      try {
        await navigator.clipboard.writeText(message.content);
      } catch {
        // з телефону (http://192.168…) браузер не дає доступу до буфера — старий спосіб
        const temp = document.createElement("textarea");
        temp.value = message.content;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
      }
      btn.textContent = "✓";
      setTimeout(() => (btn.textContent = "⧉"), 1500);
    }

    async function deleteMessage(message) {
      if (busy || !confirm("Видалити це повідомлення?")) return;
      try {
        await api("DELETE", `/messages/${message.id}`);
      } catch (err) {
        setStatus(err.message, true);
        return;
      }
      messages = messages.filter((m) => m.id !== message.id);
      renderMessages();
    }

    async function regenerate() {
      if (busy) return;
      const chatId = currentChatId;
      setBusy(true);
      setStatus("NUYRA думає ще раз…");
      try {
        const newAnswer = await api("POST", `/chats/${chatId}/regenerate`);
        if (chatId === currentChatId) {
          messages[messages.length - 1] = newAnswer; // замінюємо останню відповідь
          renderMessages();
          setStatus("");
        }
      } catch (err) {
        if (chatId === currentChatId) setStatus(err.message, true);
      } finally {
        setBusy(false);
      }
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? "error" : "";
    }

    // перемалювати список чатів у панелі
    function renderChats() {
      chatListEl.innerHTML = "";
      for (const chat of chats) {
        const li = document.createElement("li");
        li.className = "chat-item" + (chat.id === currentChatId ? " active" : "");

        const title = document.createElement("span");
        title.className = "chat-title";
        title.textContent = chat.title;
        title.title = chat.title; // повна назва у підказці при наведенні
        title.addEventListener("click", () => selectChat(chat.id));

        const del = document.createElement("button");
        del.className = "icon delete-chat";
        del.type = "button";
        del.textContent = "×";
        del.setAttribute("aria-label", "Видалити чат");
        del.addEventListener("click", () => deleteChat(chat));

        li.append(title, del);
        chatListEl.appendChild(li);
      }
      const current = chats.find((c) => c.id === currentChatId);
      chatTitleEl.textContent = current ? current.title : "";
    }

    async function selectChat(id) {
      currentChatId = id;
      renderChats();
      messages = [];
      renderMessages();
      setStatus("");
      document.body.classList.remove("sidebar-open"); // на телефоні ховаємо панель
      const loaded = await api("GET", `/chats/${id}/messages`);
      if (id !== currentChatId) return; // поки вантажили, вже відкрили інший чат
      messages = loaded;
      renderMessages();
      input.focus();
    }

    async function newChat() {
      // поточний чат ще порожній — не створюємо ще один порожній
      if (currentChatId !== null && messages.length === 0) {
        document.body.classList.remove("sidebar-open");
        input.focus();
        return;
      }
      const chat = await api("POST", "/chats");
      chats.unshift(chat); // новий чат — нагору списку
      await selectChat(chat.id);
    }

    async function deleteChat(chat) {
      if (!confirm(`Видалити чат «${chat.title}»?`)) return;
      try {
        await api("DELETE", `/chats/${chat.id}`);
      } catch (err) {
        setStatus(err.message, true);
        return;
      }
      chats = chats.filter((c) => c.id !== chat.id);
      if (chat.id !== currentChatId) {
        renderChats(); // видалили інший чат — поточний лишається
      } else if (chats.length > 0) {
        await selectChat(chats[0].id); // видалили відкритий — відкриваємо найновіший
      } else {
        currentChatId = null; // видалили останній — створюємо новий
        await newChat();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault(); // не перезавантажувати сторінку
      const text = input.value.trim();
      if (!text || busy) return;
      const chatId = currentChatId; // запам'ятовуємо: поки чекаємо, можна перемкнути чат

      messages.push({ id: null, role: "user", content: text }); // id ще немає — без кнопок
      renderMessages();
      input.value = "";
      setBusy(true);
      setStatus("NUYRA друкує…");

      try {
        const data = await api("POST", `/chats/${chatId}/messages`, { message: text });
        const chat = chats.find((c) => c.id === chatId);
        if (chat) chat.title = data.title; // назва могла змінитись після першого повідомлення
        renderChats();
        if (chatId === currentChatId) {
          messages.pop();                  // тимчасове повідомлення без id…
          messages.push(...data.messages); // …замінюємо збереженими (з id) + відповідь
          renderMessages();
          setStatus("");
        }
      } catch (err) {
        if (chatId === currentChatId) {
          messages.pop();      // повідомлення не збереглось — прибираємо його
          renderMessages();
          input.value = text;  // і повертаємо текст у поле, щоб надіслати ще раз
          setStatus(err.message, true);
        }
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    // Enter — надіслати, Shift+Enter — новий рядок
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("new-chat").addEventListener("click", newChat);
    document.getElementById("menu-btn").addEventListener("click", () => {
      document.body.classList.toggle("sidebar-open");
    });
    document.getElementById("backdrop").addEventListener("click", () => {
      document.body.classList.remove("sidebar-open"); // клік поза панеллю — закрити
    });

    // при відкритті сторінки: завантажуємо чати й відкриваємо найновіший
    async function init() {
      chats = await api("GET", "/chats");
      if (chats.length > 0) await selectChat(chats[0].id);
      else await newChat();
    }
    init();
  </script>
</body>
</html>
