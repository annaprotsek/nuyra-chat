<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUYRA</title>
  <style>
    /* біло-фіолетово-бузкова палітра */
    :root {
      --bg: #faf7ff;
      --panel: #ffffff;
      --text: #2e1a47;
      --muted: #8a7aa8;
      --border: #dcd0f5;
      --user-bg: #7c4dff;
      --user-text: #ffffff;
      --bot-bg: #ede7fb;
      --bot-text: #2e1a47;
      --accent-from: #7c4dff;
      --accent-to: #b388ff;
      --error: #d6336c;
    }
    /* темна тема: темно-фіолетовий фон, бузкові акценти */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16111f;
        --panel: #1f1830;
        --text: #efe8ff;
        --muted: #a497c2;
        --border: #3a2e55;
        --user-bg: #8f6bff;
        --bot-bg: #2c2342;
        --bot-text: #efe8ff;
        --accent-from: #b388ff;
        --accent-to: #e0c3ff;
        --error: #ff7aa2;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .logo {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.12em;
      background: linear-gradient(90deg, var(--accent-from), var(--accent-to));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      white-space: pre-wrap;      /* зберігаємо переноси рядків */
      overflow-wrap: anywhere;    /* довгі слова не ламають розмітку */
    }
    .user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bot-bg); color: var(--bot-text); border-bottom-left-radius: 4px; }
    #status { min-height: 1.5em; padding: 0 16px; max-width: 760px; width: 100%; margin: 0 auto; color: var(--muted); font-size: 14px; }
    #status.error { color: var(--error); }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    textarea::placeholder { color: var(--muted); }
    textarea:focus { outline: 2px solid var(--user-bg); outline-offset: -1px; }
    button {
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: var(--user-bg);
      color: var(--user-text);
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header><span class="logo">NUYRA</span></header>
  <main id="messages"></main>
  <div id="status"></div>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Напиши повідомлення… (Enter — надіслати, Shift+Enter — новий рядок)"></textarea>
    <button id="send" type="submit">➤</button>
  </form>

  <script>
    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // додати одне повідомлення на сторінку
    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = content; // textContent, щоб HTML у тексті не виконувався
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight; // прокрутити донизу
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? "error" : "";
    }

    // при відкритті сторінки показуємо історію з бази
    async function loadHistory() {
      const res = await fetch("/messages");
      const messages = await res.json();
      messages.forEach((m) => addMessage(m.role, m.content));
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault(); // не перезавантажувати сторінку
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      sendBtn.disabled = true;
      setStatus("NUYRA друкує…");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Щось пішло не так");
        addMessage("assistant", data.answer);
        setStatus("");
      } catch (err) {
        messagesEl.lastChild.remove(); // повідомлення не збереглось — прибираємо його
        input.value = text;            // і повертаємо текст у поле, щоб надіслати ще раз
        setStatus(err.message, true);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    // Enter — надіслати, Shift+Enter — новий рядок
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    loadHistory();
  </script>
</body>
</html>
